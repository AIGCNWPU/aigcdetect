name: Framework checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx --yes --package @fission-ai/openspec@1.13.1 openspec validate --all --strict --no-interactive
        env:
          OPENSPEC_TELEMETRY: '0'
      - run: npm run build
      - name: Built service readiness
        shell: bash
        run: |
          npm start > /tmp/aigcdetect-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/api/v1/health > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:4173/ > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/assets/app.js > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/assets/styles.css > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/api/v1/health > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/api/v1/image/refund/status > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/api/v1/video/aftersales/status > /dev/null
