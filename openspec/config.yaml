schema: spec-driven

context: |
  项目：VERITAS 智鉴 AI检测平台，4个模块、10个业务场景。
  当前3.1通用AI生成视频检测已提供上传、任务、样例结果、时间段、代表画面与报告导出的前端工作台；检测服务未接入，样例明确标注，其余9个场景工作区仍为空白。
  已有原生JavaScript模块、CSS、Node.js HTTP空接口、离线构建；无需外部运行依赖。
  所有10个业务接口返回501，检测算法、文件存储、身份权限、任务、报告和大模型尚未实现。
  需求来自references/AI检测平台_需求摘录.md及其中说明的修订核对；最新用户指令优先。
  公共框架映射唯一来源：changes/define-shared-foundation/design.md。
  两位组长负责公共底座与集成，六位业务同学分担10个现有场景工作包，归属唯一索引为docs/TEAM_DEVELOPMENT.md。
  ①高佳楠仅1.1；②智森慧1.2和1.3；③吕佳文2.1和2.3；④闭耀松2.2和3.3；⑤毛向智3.1和3.2；⑥张启宇4.1。
  保留10个工作包，不按人数合并目录。具体方案、算法、供应商和开发细任务由负责人接手后完善。
  组长先提供统一样例与最少引用，再补保存版本、文件与预处理、任务配置和报告支撑；各场景可使用明确标注的样例并行开发。
  共享配置与服务修改需要在PR说明，具体归属见docs/TEAM_DEVELOPMENT.md。
  正文用中文，保留OpenSpec结构标题、SHALL/MUST及WHEN/THEN。
  业务工作包保持待实现；文档与501占位检查通过不等于业务完成，不提前勾选或归档。
  分支统一使用姓名缩写/模块或功能，命名示例与贡献流程见CONTRIBUTING.md；项目技能是.agents/skills内的OpenSpec技能。

rules:
  proposal:
    - 写清需求章节、已分配的负责人编号与姓名、范围和非目标；跨场景边界引用开发索引和公共约定。
  specs:
    - 使用ADDED Requirements；每项Requirement含SHALL或MUST及至少一个Scenario。
    - 保留需求对应内容，失败与修订行为引用公共约定。
  design:
    - 区分已经存在的空框架与未来业务实现，不将接口占位写成算法已接入。
  tasks:
    - 业务任务使用未勾选的三个交接里程碑，细任务由负责人补充。
