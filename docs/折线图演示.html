<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>伪造区间 · 折线图演示</title>
<style>
  @page { size: A4 landscape; margin: 12mm; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 28px 34px;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #f5f6f8; color: #1d1d1f;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }
  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 18px; }
  .eyebrow { font-size: 10px; letter-spacing: .16em; color: #bf7a29; font-weight: 600; margin-bottom: 8px; }
  h1 { font-size: 24px; margin: 0; letter-spacing: -.02em; }
  .sub { font-size: 12.5px; color: #8b93a0; margin-top: 6px; }
  .badge { font-size: 11px; color: #8a6529; background: #faf1e4; border: 1px solid #f3e3ca; padding: 8px 12px; border-radius: 10px; white-space: nowrap; }
  .card { background: #fff; border: 1px solid #eef0f4; border-radius: 18px; padding: 20px 24px 16px; box-shadow: 0 8px 26px rgba(39,59,100,.05); }
  .toolbar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .chip { border: 1px solid #e6e9ef; background: #fbfbfc; color: #5d6672; font-size: 12px; padding: 8px 13px; border-radius: 10px; cursor: pointer; }
  .chip.active { border-color: #bf7a29; background: #fffaf1; color: #8a5a1f; font-weight: 600; }
  .verdict { display: flex; align-items: baseline; gap: 14px; margin: 4px 0 8px; }
  .verdict strong { font-size: 17px; }
  .verdict .p { font-family: Consolas, monospace; font-size: 13px; color: #6b7280; }
  .tag { font-size: 10.5px; padding: 3px 9px; border-radius: 20px; background: #fbeee9; color: #b4472f; font-weight: 600; }
  .tag.real { background: #eaf4ef; color: #2f7a5c; }
  svg { display: block; width: 100%; height: auto; }
  .legend { display: flex; gap: 22px; font-size: 11px; color: #7d8794; margin-top: 8px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 14px; height: 2px; vertical-align: 3px; margin-right: 6px; }
  .note { font-size: 11px; color: #98a1ad; line-height: 1.8; margin-top: 14px; padding-top: 12px; border-top: 1px solid #f0f1f4; }
  .grid-line { stroke: #eef0f3; stroke-width: 1; }
  .axis-text { font-size: 11px; fill: #98a1ad; font-family: "Microsoft YaHei", sans-serif; }
  .thr { stroke: #c9a227; stroke-width: 1.4; stroke-dasharray: 5 4; }
  .band { fill: rgba(180,71,47,.10); }
  .truth-bar { fill: rgba(47,122,92,.55); }
  .line { fill: none; stroke: #b4472f; stroke-width: 2.2; stroke-linejoin: round; }
  .dot { fill: #fff; stroke: #b4472f; stroke-width: 2; }
  .tip { position: fixed; pointer-events: none; background: rgba(29,29,31,.92); color: #fff; font-size: 11px; padding: 6px 9px; border-radius: 7px; display: none; white-space: nowrap; }
  @media print { body { background: #fff; padding: 0; } .chip { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <div class="eyebrow">AUDIO FORENSICS · 区间评分</div>
      <h1>可疑片段评分曲线</h1>
      <div class="sub">按 10 秒窗口滑动评分，横轴为窗口中心时间。数据来自服务器实测。</div>
    </div>
    <div class="badge">音频鉴伪引擎 · v1</div>
  </div>

  <div class="card">
    <div class="toolbar" id="tabs">
      <button class="chip active" data-key="mixed">60 秒 · 混合（含 20 秒伪造）</button>
      <button class="chip" data-key="fake">60 秒 · 整段伪造</button>
      <button class="chip" data-key="real">60 秒 · 整段真人</button>
    </div>

    <div class="verdict">
      <span class="tag" id="tag">AI 合成语音</span>
      <strong id="title">检测到 AI 伪造痕迹</strong>
      <span class="p" id="score">P(fake) = 1.000</span>
    </div>

    <svg id="chart" viewBox="0 0 1060 300" role="img" aria-label="窗口评分曲线"></svg>

    <div class="legend">
      <span><i style="background:#b4472f"></i>窗口伪造评分</span>
      <span><i style="background:#c9a227"></i>判定阈值 0.5</span>
      <span><i style="background:rgba(180,71,47,.35)"></i>系统判定的可疑区间</span>
      <span><i style="background:rgba(47,122,92,.65);height:6px"></i>真实篡改区间</span>
    </div>

    <p class="note">
      每个点是一个 10 秒窗口的独立推理结果（窗口起点间隔 5 秒，相邻窗口 50% 重叠）。
      曲线在两点之间是连线，不代表中间时刻的真实评分——系统没有对 2.5 秒、7.5 秒这些位置做过推理。
      判定阈值 0.5 为模型默认值，尚未按业务场景校准。
    </p>
  </div>
</div>
<div class="tip" id="tip"></div>

<script>
const DATA = {
  mixed: {
    starts: [0,5,10,15,20,25,30,35,40,45,50],
    scores: [0.001,0.003,0.029,0.984,0.997,1.000,0.999,0.999,0.001,0.003,0.029],
    detected: [[15,45]], truth: [[20,40]],
    verdict: "fake", p: 1.000,
    tag: "AI 合成语音", title: "检测到 AI 伪造痕迹",
    note: "真实篡改位于 20–40 秒；系统合并超阈值窗口后给出 15–45 秒，边界误差约半个窗宽。"
  },
  fake: {
    starts: [0,5,10,15,20,25,30,35,40,45,50],
    scores: [0.997,1.000,0.999,1.000,0.997,1.000,0.999,1.000,0.997,1.000,0.999],
    detected: "all", truth: [[0,60]],
    verdict: "fake", p: 1.000,
    tag: "AI 合成语音", title: "整段判为伪造",
    note: "所有窗口都超过阈值，系统返回「全段」，不给出具体区间。"
  },
  real: {
    starts: [0,5,10,15,20,25,30,35,40,45,50],
    scores: [0.001,0.003,0.029,0.002,0.001,0.003,0.029,0.002,0.001,0.003,0.029],
    detected: [], truth: [],
    verdict: "real", p: 0.029,
    tag: "真实录音", title: "未发现合成痕迹",
    note: "没有任何窗口超过阈值，系统返回「无可疑片段」——不会因为 argmax 而凭空报出一段。"
  }
};

const W = 1060, H = 300, PAD = { l: 56, r: 24, t: 18, b: 42 };
const X = t => PAD.l + (t / 60) * (W - PAD.l - PAD.r);
const Y = v => PAD.t + (1 - v) * (H - PAD.t - PAD.b);

function render(key) {
  const d = DATA[key];
  const svg = document.getElementById('chart');
  const parts = [];

  // 可疑区间 / 真实区间
  const bands = (list, cls) => (Array.isArray(list) ? list : []).forEach(([a, b]) => {
    parts.push(`<rect class="${cls}" x="${X(a)}" y="${PAD.t}" width="${X(b) - X(a)}" height="${H - PAD.t - PAD.b}"/>`);
  });
  bands(d.detected === 'all' ? [[0, 60]] : d.detected, 'band');

  // 真实区间画成底部细条，避免和可疑区间叠色
  (Array.isArray(d.truth) ? d.truth : []).forEach(([a, b]) => {
    parts.push(`<rect class="truth-bar" x="${X(a)}" y="${H - PAD.b - 7}" width="${X(b) - X(a)}" height="7" rx="2"/>`);
  });

  // 网格与坐标
  [0, 0.25, 0.5, 0.75, 1].forEach(v => {
    parts.push(`<line class="grid-line" x1="${PAD.l}" y1="${Y(v)}" x2="${W - PAD.r}" y2="${Y(v)}"/>`);
    parts.push(`<text class="axis-text" x="${PAD.l - 10}" y="${Y(v) + 4}" text-anchor="end">${v.toFixed(2)}</text>`);
  });
  [0, 10, 20, 30, 40, 50, 60].forEach(t => {
    parts.push(`<text class="axis-text" x="${X(t)}" y="${H - PAD.b + 20}" text-anchor="middle">${t}s</text>`);
  });
  parts.push(`<text class="axis-text" x="${PAD.l}" y="${PAD.t - 8}">P(fake)</text>`);

  // 阈值线
  parts.push(`<line class="thr" x1="${PAD.l}" y1="${Y(0.5)}" x2="${W - PAD.r}" y2="${Y(0.5)}"/>`);
  parts.push(`<text class="axis-text" x="${W - PAD.r}" y="${Y(0.5) - 6}" text-anchor="end" fill="#c9a227">阈值 0.50</text>`);

  // 折线（取窗口中心）
  const pts = d.starts.map((s, i) => [s + 5, d.scores[i]]);
  const path = pts.map(([t, v], i) => `${i ? 'L' : 'M'}${X(t).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  parts.push(`<path class="line" d="${path}"/>`);

  // 数据点
  pts.forEach(([t, v], i) => {
    parts.push(`<circle class="dot" cx="${X(t)}" cy="${Y(v)}" r="4.5" data-i="${i}" data-t="${t}" data-v="${v.toFixed(3)}"/>`);
  });

  svg.innerHTML = parts.join('');

  document.getElementById('tag').textContent = d.tag;
  document.getElementById('tag').className = 'tag' + (d.verdict === 'real' ? ' real' : '');
  document.getElementById('title').textContent = d.title;
  document.getElementById('score').textContent = `P(fake) = ${d.p.toFixed(3)}`;
  document.querySelector('.note').textContent = d.note + ` 每个点是一个 10 秒窗口的独立推理结果（窗口起点间隔 5 秒，相邻窗口 50% 重叠）。曲线在两点之间是连线，不代表中间时刻的真实评分。`;
}

document.getElementById('tabs').addEventListener('click', e => {
  const btn = e.target.closest('.chip');
  if (!btn) return;
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c === btn));
  render(btn.dataset.key);
});

document.getElementById('chart').addEventListener('mousemove', e => {
  const dot = e.target.closest('.dot');
  const tip = document.getElementById('tip');
  if (!dot) { tip.style.display = 'none'; return; }
  tip.style.display = 'block';
  tip.style.left = (e.pageX + 12) + 'px';
  tip.style.top = (e.pageY - 28) + 'px';
  tip.textContent = `${dot.dataset.t} 秒窗口 · P(fake) = ${dot.dataset.v}`;
});
document.getElementById('chart').addEventListener('mouseleave', () => {
  document.getElementById('tip').style.display = 'none';
});

const initialKey = location.hash.slice(1) || new URLSearchParams(location.search).get('case') || 'mixed';
document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.key === initialKey));
render(initialKey);
</script>
</body>
</html>
